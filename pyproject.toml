[project]
name = "ds-next"
version = "0.2.0"
description = "ds, rebuilt small: a Claude-Code-style terminal over Cortex Code that scaffolds projects from the canon"
requires-python = ">=3.12"
dependencies = [
    # Snowflake's Cortex Agent SDK (Public Preview, 2026-10-13); its cortexcode module drives the
    # local Cortex Code CLI and supersedes cortex-code-agent-sdk. It caps mcp below 2 itself.
    "snowflake-cortex-agent-sdk==0.0.2",
    # Claude Code's SDK, the one Cortex's is a fork of; sdk.py picks whichever agent this machine uses.
    "claude-agent-sdk>=0.2",
    # MCP itself: codex.py serves the terminal's tools to Codex through it (claude-agent-sdk needs it too).
    "mcp>=1.0,<2",
    # The terminal design system (roles, glyphs, grid, frames, banner, the prompt box, the widgets) is
    # canon's: canon-lib's ui_style and widgets, the tui extra, pinned to a release tag. Shared with atlas.
    "canon-lib[tui] @ git+https://github.com/cwkoenigs/canon@canon-lib-v0.2.0#subdirectory=lib",
    "rich>=13",
    "prompt-toolkit>=3.0.40",
    "typer>=0.12",
]

[project.optional-dependencies]
test = ["pytest>=8", "pyyaml>=6"]

[project.scripts]
ds-next = "ds_next.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ds_next"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls Cortex Code; run with DS_LIVE=1"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
# typer declares options as argument defaults; that is the library's idiom
"src/ds_next/cli.py" = ["B008"]

[tool.hatch.metadata]
# canon-lib comes from canon's git tag (dependencies above), which pip and uv both install.
allow-direct-references = true
