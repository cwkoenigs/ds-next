[project]
name = "rule-cli"
version = "0.1.0"
description = "The Rule terminal design system (ds-next, Modernist direction) as a sample CLI that walks through every part of it."
requires-python = ">=3.10"
dependencies = ["rich>=13"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
rule-cli = "rule_cli.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rule_cli"]
